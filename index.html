<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เลือกระบบตรวจสภาพรถ</title>
<style>
  :root{
    --bg:#0f1a14;--bg2:#132318;--card:#17281d;--line:#2a3f30;
    --text:#eef3ec;--sub:#9fb3a6;--accent:#4caf6d;--accent-2:#2d8a4e;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f2f6f1;--bg2:#e9f0e6;--card:#ffffff;--line:#d9e4d3;
      --text:#152016;--sub:#5b6b5a;--accent:#2d8a4e;--accent-2:#1f6b3a;
    }
  }
  :root[data-theme="light"]{
    --bg:#f2f6f1;--bg2:#e9f0e6;--card:#ffffff;--line:#d9e4d3;
    --text:#152016;--sub:#5b6b5a;--accent:#2d8a4e;--accent-2:#1f6b3a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  body{
    background:radial-gradient(1200px 600px at 15% -10%, var(--bg2), transparent), var(--bg);
    color:var(--text);
    font-family:"Noto Sans Thai","Sarabun",-apple-system,system-ui,sans-serif;
    display:flex;align-items:flex-start;justify-content:center;
    padding:40px 20px;min-height:100%;
  }
  .wrap{width:100%;max-width:900px;}
  .head{text-align:center;margin-bottom:32px;}
  .head .tag{font-size:14px;color:var(--sub);margin-bottom:8px;}
  .head h1{font-size:clamp(24px,4vw,32px);line-height:1.3;margin:0;font-weight:700;}
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:16px;
  }
  a.card{
    display:block;text-decoration:none;color:var(--text);
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:24px 20px;transition:border-color .15s ease, transform .15s ease;
    position:relative;overflow:hidden;
  }
  a.card::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(135deg,var(--accent) 0%, transparent 60%);
    opacity:0;transition:opacity .15s ease;
  }
  a.card:hover{border-color:var(--accent-2);transform:translateY(-2px);}
  a.card:hover::before{opacity:.06;}
  a.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  a.card.disabled{opacity:.45;pointer-events:none;}
  .card .icon{
    width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:14px;
  }
  .card h2{margin:0 0 6px 0;font-size:17px;font-weight:700;}
  .card p{margin:0;font-size:13px;color:var(--sub);line-height:1.6;}
  .card .go{margin-top:14px;font-size:13px;font-weight:600;color:var(--accent-2);}
  footer{text-align:center;margin-top:28px;font-size:12px;color:var(--sub);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="tag">ระบบตรวจสภาพรถ &amp; เป่าแอลกอฮอล์</div>
      <h1>เลือกระบบที่ต้องการเข้าใช้งาน</h1>
    </div>
    <div id="grid"></div>
    <footer>เลือกระบบด้านบนเพื่อไปยังหน้าบันทึกข้อมูล</footer>
  </div>

<script>
  // ===== เพิ่ม/แก้ระบบใหม่ตรงนี้ที่เดียว =====
  // ถ้ายังไม่มี url ให้ใส่ null ไว้ก่อน การ์ดจะขึ้นแบบจางๆ กดไม่ได้ พร้อมข้อความ "เร็วๆ นี้"
  const systems = [
    {
      icon: "🚚",
      name: "ขนส่งน้ำมันพืช",
      desc: "ติดตามสถานะตรวจสภาพรถและผลตรวจแอลกอฮอล์ สายขนส่งน้ำมันพืช",
      url: "https://script.google.com/a/macros/pt.co.th/s/AKfycbwnLrgV8x5M2LNj2yhiv7ieqlyRXXr1hS4H8v_lgRlmsHtwWkQTmmAe6grWk-APkMYRzw/exec"
    },
    {
      icon: "🏭",
      name: "DC วังน้อย",
      desc: "ติดตามสถานะตรวจสภาพรถและผลตรวจแอลกอฮอล์ ศูนย์กระจายสินค้าวังน้อย",
      url: "https://script.google.com/a/macros/pt.co.th/s/AKfycbx6tuTQp_03Jol-WLecVzUzGXUTGltuJDS6MgAvgK-Xf6mNFh7QrrEkX3wF47JUEZS7fA/exec"
    },
    {
      icon: "♻️",
      name: "ขยะอุตสาหกรรม",
      desc: "ติดตามสถานะตรวจสภาพรถและผลตรวจแอลกอฮอล์ สายขนส่งขยะอุตสาหกรรม",
      url: null
    },
    {
      icon: "🍯",
      name: "น้ำเชื่อม",
      desc: "ติดตามสถานะตรวจสภาพรถและผลตรวจแอลกอฮอล์ สายขนส่งน้ำเชื่อม",
      url: null
    }
  ];
  // ===========================================

  const grid = document.getElementById('grid');
  systems.forEach(s => {
    const el = document.createElement('a');
    el.className = 'card' + (s.url ? '' : ' disabled');
    el.href = s.url || '#';
    if (s.url) { el.target = '_self'; }
    el.innerHTML = `
      <div class="icon">${s.icon}</div>
      <h2>${s.name}</h2>
      <p>${s.desc}</p>
      <div class="go">${s.url ? 'เข้าสู่ระบบ →' : 'เร็วๆ นี้'}</div>
    `;
    grid.appendChild(el);
  });
</script>
</body>
</html>
