<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เลือกสายงานตรวจสภาพรถ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --board:#0b1220;
    --board-2:#131b2c;
    --ink:#0b1220;
    --sub:#667085;
    --sub-soft:#a4abb8;
    --line:#eaecf0;
    --amber:#f5a524;

    --oil:#c8790f;   --oil-soft:#fdf1de;
    --dc:#2557d6;    --dc-soft:#e7edfc;
    --waste:#2f8a5b; --waste-soft:#e6f4ec;
    --syrup:#b8460e; --syrup-soft:#fbe9e0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Sarabun","Noto Sans Thai",-apple-system,system-ui,sans-serif;
    display:flex;justify-content:center;padding:0 20px 56px;min-height:100%;
  }
  .wrap{width:100%;max-width:720px;}

  .brand{
    display:flex;align-items:center;gap:10px;
    padding:22px 0 32px;
  }
  .brand .mark{
    width:36px;height:36px;border-radius:8px;background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 2px rgba(11,18,32,.10), inset 0 0 0 1px var(--line);
    overflow:hidden;flex-shrink:0;
  }
  .brand .mark img{width:100%;height:100%;object-fit:contain;padding:4px;}
  .brand span{font-size:14px;color:var(--sub);font-weight:500;}

  h1{
    font-size:clamp(28px,4.6vw,38px);
    font-weight:700;letter-spacing:-0.015em;line-height:1.2;
    margin:0 0 10px 0;
  }
  .sub{font-size:15.5px;color:var(--sub);line-height:1.6;margin:0 0 30px 0;max-width:46ch;}

  .board{
    border-radius:16px;overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(11,18,32,.04);
  }
  .board-head{
    background:var(--board);
    background-image:linear-gradient(180deg,var(--board-2),var(--board));
    color:#fff;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;
    font-size:13px;
  }
  .board-head .l1{color:#fff;font-weight:600;}
  .board-head .l2{color:var(--sub-soft);}

  .rows{background:var(--bg);}
  a.row, div.row{
    display:flex;align-items:center;gap:16px;
    padding:19px 22px;
    text-decoration:none;color:var(--ink);
    border-top:1px solid var(--line);
    transition:background-color .12s ease;
  }
  .badge{
    width:40px;height:40px;border-radius:11px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .row.oil .badge{background:var(--oil-soft);}
  .row.dc .badge{background:var(--dc-soft);}
  .row.waste .badge{background:var(--waste-soft);}
  .row.syrup .badge{background:var(--syrup-soft);}
  .row.disabled .badge{background:#f4f5f7;}

  .info{flex:1;min-width:0;}
  .info h2{margin:0 0 2px 0;font-size:16px;font-weight:600;}
  .info p{margin:0;font-size:13px;color:var(--sub);line-height:1.5;}

  .pill{
    flex-shrink:0;font-size:12.5px;font-weight:600;
    padding:6px 12px;border-radius:999px;white-space:nowrap;
  }
  .row.oil .pill{background:var(--oil-soft);color:var(--oil);}
  .row.dc .pill{background:var(--dc-soft);color:var(--dc);}
  .row.waste .pill{background:var(--waste-soft);color:var(--waste);}
  .row.syrup .pill{background:var(--syrup-soft);color:var(--syrup);}
  .row.disabled .pill{background:#f4f5f7;color:var(--sub-soft);}
  .row.disabled .info h2{color:var(--sub);}
  .row.disabled{cursor:default;}

  a.row.oil:hover{background:var(--oil-soft);}
  a.row.dc:hover{background:var(--dc-soft);}
  a.row.waste:hover{background:var(--waste-soft);}
  a.row.syrup:hover{background:var(--syrup-soft);}
  a.row:focus-visible{outline:2px solid var(--dc);outline-offset:-2px;}

  .stat{
    margin-top:18px;text-align:center;font-size:13px;color:var(--sub-soft);
  }
  .stat b{color:var(--ink);font-weight:600;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="mark"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSu93ZfbmmkcYSx_RyepMSm-k99-Z1-LZvPZa3qKx4EIA&s=10" alt="โลโก้บริษัท"></div>
      <span>ระบบตรวจสภาพรถ &amp; เป่าแอลกอฮอล์</span>
    </div>

    <h1>เลือกสายงานที่ต้องการตรวจสภาพรถ</h1>
    <p class="sub">ติดตามสถานะตรวจสภาพรถและผลตรวจแอลกอฮอล์ แยกตามสายขนส่งแต่ละเส้นทาง</p>

    <div class="board">
      <div class="board-head">
        <span class="l1">สายงานขนส่ง</span>
        <span class="l2" id="statusLabel">สถานะระบบ</span>
      </div>
      <div class="rows" id="rows"></div>
    </div>

    <div class="stat" id="stat"></div>
  </div>

<script>
  // ===== เพิ่ม/แก้สายงานตรงนี้ที่เดียว =====
  const systems = [
    { category:"oil",   icon:"🚛", name:"ขนส่งน้ำมันพืช",   desc:"ตรวจสภาพรถและผลตรวจแอลกอฮอล์ สายขนส่งน้ำมันพืช",
      url:"https://script.google.com/a/macros/pt.co.th/s/AKfycbwnLrgV8x5M2LNj2yhiv7ieqlyRXXr1hS4H8v_lgRlmsHtwWkQTmmAe6grWk-APkMYRzw/exec" },
    { category:"dc",    icon:"🏭", name:"DC วังน้อย",       desc:"ตรวจสภาพรถและผลตรวจแอลกอฮอล์ ศูนย์กระจายสินค้าวังน้อย",
      url:"https://script.google.com/a/macros/pt.co.th/s/AKfycbx6tuTQp_03Jol-WLecVzUzGXUTGltuJDS6MgAvgK-Xf6mNFh7QrrEkX3wF47JUEZS7fA/exec" },
    { category:"waste", icon:"♻️", name:"ขยะอุตสาหกรรม",    desc:"ตรวจสภาพรถและผลตรวจแอลกอฮอล์ สายขนส่งขยะอุตสาหกรรม", url:null },
    { category:"syrup", icon:"🍯", name:"น้ำเชื่อม",        desc:"ตรวจสภาพรถและผลตรวจแอลกอฮอล์ สายขนส่งน้ำเชื่อม",     url:null }
  ];
  // ==========================================

  const rows = document.getElementById('rows');
  systems.forEach(s => {
    const el = document.createElement(s.url ? 'a' : 'div');
    el.className = 'row ' + (s.url ? s.category : 'disabled');
    if (s.url) el.href = s.url;
    el.innerHTML = `
      <div class="badge">${s.icon}</div>
      <div class="info"><h2>${s.name}</h2><p>${s.desc}</p></div>
      <div class="pill">${s.url ? 'พร้อมใช้งาน' : 'เร็วๆ นี้'}</div>
    `;
    rows.appendChild(el);
  });

  const active = systems.filter(s => s.url).length;
  document.getElementById('stat').innerHTML =
    `ทั้งหมด <b>${systems.length}</b> สายงาน · พร้อมใช้งาน <b>${active}</b>`;
</script>
</body>
</html>
